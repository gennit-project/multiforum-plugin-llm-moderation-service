name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80 -q

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Validate Terraform
        run: |
          terraform -chdir=bootstrap/foundation fmt -check
          terraform -chdir=bootstrap/foundation init -backend=false
          terraform -chdir=bootstrap/foundation validate
          terraform -chdir=bootstrap fmt -check
          terraform -chdir=bootstrap init -backend=false
          terraform -chdir=bootstrap validate
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
