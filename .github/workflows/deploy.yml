name: Deploy security scanner

on:
  workflow_dispatch:
    inputs:
      run_test_scan:
        description: Run an authenticated scan using SCAN_TEST_FILE_URL
        required: false
        default: true
        type: boolean

concurrency:
  group: security-scan-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision, deploy, and verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_environment: production
      TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
      TF_VAR_service_name: ${{ vars.CLOUD_RUN_SERVICE || 'security-scan-service' }}
      TF_VAR_artifact_repository: ${{ vars.ARTIFACT_REPOSITORY || 'multiforum-services' }}
      TF_VAR_deployment_revision: run-${{ github.run_id }}-${{ github.run_attempt }}
      SCAN_API_KEY: ${{ secrets.SCAN_API_KEY }}
      SCAN_VIRUSTOTAL_API_KEY: ${{ secrets.SCAN_VIRUSTOTAL_API_KEY }}
      MULTIFORUM_GRAPHQL_URL: ${{ vars.MULTIFORUM_GRAPHQL_URL }}
      MULTIFORUM_OAUTH_TOKEN_URL: ${{ vars.MULTIFORUM_OAUTH_TOKEN_URL }}
      MULTIFORUM_OAUTH_CLIENT_ID: ${{ vars.MULTIFORUM_OAUTH_CLIENT_ID }}
      MULTIFORUM_OAUTH_CLIENT_SECRET: ${{ secrets.MULTIFORUM_OAUTH_CLIENT_SECRET }}
      MULTIFORUM_OAUTH_AUDIENCE: ${{ vars.MULTIFORUM_OAUTH_AUDIENCE }}
      MULTIFORUM_OAUTH_SCOPE: plugin-configuration:write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          required=(
            TF_VAR_project_id
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_DEPLOY_SERVICE_ACCOUNT
            TF_STATE_BUCKET
            SCAN_API_KEY
            SCAN_VIRUSTOTAL_API_KEY
            MULTIFORUM_GRAPHQL_URL
            MULTIFORUM_OAUTH_TOKEN_URL
            MULTIFORUM_OAUTH_CLIENT_ID
            MULTIFORUM_OAUTH_CLIENT_SECRET
            MULTIFORUM_OAUTH_AUDIENCE
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing production variable or secret: ${name}"
              exit 1
            fi
          done
          if (( ${#SCAN_API_KEY} < 32 )); then
            echo "::error::SCAN_API_KEY must contain at least 32 characters."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Initialize Terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=security-scan/production"
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform validate

      # The image repository and secret containers must exist before an image
      # or secret version can be uploaded. Both remain managed in the same
      # Terraform state; the targeted apply only resolves this first-run order.
      - name: Provision build prerequisites
        run: >-
          terraform -chdir=terraform apply -auto-approve
          -target='google_project_service.required'
          -target='google_artifact_registry_repository.images'
          -target='google_secret_manager_secret.api_key'
          -target='google_secret_manager_secret.virustotal_api_key'
          -var="image=bootstrap.invalid/security-scan:unpublished"

      - name: Upload secret versions
        run: |
          set -euo pipefail
          printf '%s' "${SCAN_API_KEY}" |
            gcloud secrets versions add scan-api-key --data-file=-
          printf '%s' "${SCAN_VIRUSTOTAL_API_KEY}" |
            gcloud secrets versions add virustotal-api-key --data-file=-

      - name: Build and publish immutable image
        id: image
        run: |
          set -euo pipefail
          registry="${TF_VAR_region}-docker.pkg.dev"
          image="${registry}/${TF_VAR_project_id}/${TF_VAR_artifact_repository}/security-scan-service:${GITHUB_SHA}"
          gcloud auth configure-docker "${registry}" --quiet
          docker build --tag "${image}" .
          docker push "${image}"
          echo "uri=${image}" >> "${GITHUB_OUTPUT}"

      - name: Plan infrastructure
        run: >-
          terraform -chdir=terraform plan
          -out=production.tfplan
          -var="image=${{ steps.image.outputs.uri }}"

      - name: Apply infrastructure
        run: terraform -chdir=terraform apply -auto-approve production.tfplan

      - name: Read deployed service URL
        id: service
        run: |
          service_url="$(terraform -chdir=terraform output -raw service_url)"
          echo "url=${service_url}" >> "${GITHUB_OUTPUT}"
          echo "### Security scanner deployment" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Service: ${service_url}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Image: ${{ steps.image.outputs.uri }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify health and authentication
        run: >-
          python scripts/verify_deployment.py
          --service-url "${{ steps.service.outputs.url }}"
          --api-key "${SCAN_API_KEY}"
          --require-virustotal

      - name: Run safe test scan
        if: ${{ inputs.run_test_scan }}
        env:
          SCAN_TEST_FILE_URL: ${{ vars.SCAN_TEST_FILE_URL }}
        run: |
          if [[ -z "${SCAN_TEST_FILE_URL}" ]]; then
            echo "::error::SCAN_TEST_FILE_URL is required when run_test_scan is enabled."
            exit 1
          fi
          python scripts/verify_deployment.py --service-url "${{ steps.service.outputs.url }}" --api-key "${SCAN_API_KEY}" --require-virustotal --test-file-url "${SCAN_TEST_FILE_URL}" --expected-verdict clean

      # Pin mfctl to the reviewed backend merge containing the v1alpha1
      # reconciliation contract and scoped client-credentials authentication.
      - name: Check out Multiforum operator CLI
        uses: actions/checkout@v4
        with:
          repository: gennit-project/multiforum-backend
          ref: 304aa3046c03e2bd91dd9ad2e8c8f378f32c9447
          path: .mfctl

      - name: Set up Node for mfctl
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install pinned mfctl dependencies
        working-directory: .mfctl
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Render Multiforum plugin configuration
        env:
          SCAN_BLOCK_ON: ${{ vars.SCAN_BLOCK_ON || 'malicious' }}
          SCAN_ON_ERROR: ${{ vars.SCAN_ON_ERROR || 'block' }}
        run: >-
          python scripts/render_multiforum_configuration.py
          --service-url "${{ steps.service.outputs.url }}"
          --block-on "${SCAN_BLOCK_ON}"
          --on-error "${SCAN_ON_ERROR}"
          --output "${RUNNER_TEMP}/security-scan-plugin-configuration.json"

      - name: Reconcile Multiforum plugin configuration
        working-directory: .mfctl
        run: >-
          pnpm mfctl plugin-config apply
          --manifest "${RUNNER_TEMP}/security-scan-plugin-configuration.json"

      - name: Record reconciliation result
        run: |
          echo "### Multiforum reconciliation" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Plugin: security-attachment-scan v0.5.1" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Service URL and shared API key: reconciled" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Server pipelines: created, updated, and downloaded events reconciled" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Pipeline applicability: all files, immediate enforcement" >> "${GITHUB_STEP_SUMMARY}"
